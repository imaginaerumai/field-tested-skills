name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node --test scripts/*.test.mjs
      - run: node skills/writing/stopslop/scripts/stopslop.mjs README.md docs/*.md skills/autopilot/principal-autopilot/SKILL.md skills/writing/stopslop/SKILL.md skills/ops/purge-stress/SKILL.md
